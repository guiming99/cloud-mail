          # ---------- Router ----------
          p = Path('mail-vue/src/router/index.js')
          s = p.read_text(encoding='utf-8')
          marker = '''            {
                path: '/settings',''''
          route = '''            {
                path: '/conversation',
                name: 'conversation',
                component: () => import('@/views/conversation/index.vue'),
                meta: {
                    title: 'conversation',
                    name: 'conversation',
                    menu: false
                }
            },
            {
                path: '/settings','''
          if "name: 'conversation'" not in s:
            if marker not in s: raise SystemExit('router marker not found')
            s = s.replace(marker, route, 1)
          s = s.replace("['content', 'email', 'send']", "['content', 'email', 'conversation', 'send']")
          p.write_text(s, encoding='utf-8')

