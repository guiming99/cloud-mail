          Path('mail-worker/src/service/conversation-service.js').write_text(r'''import orm from '../entity/orm';
import email from '../entity/email';
import account from '../entity/account';
import attService from './att-service';
import { and, desc, eq, ne, or } from 'drizzle-orm';
import { emailConst, isDel } from '../const/entity-const';

function normalizeSubject(subject = '') {
  return String(subject)
    .replace(/^\s*((re|fw|fwd|回复|转发)\s*[:：]\s*)+/ig, '')
    .trim()
    .toLowerCase();
}

function parseList(value) {
  try { return JSON.parse(value || '[]'); } catch { return []; }
}

function participants(row) {
  const list = row.type === emailConst.type.SEND ? parseList(row.recipient) : [{ address: row.sendEmail }];
  return [...new Set(list.map(x => String(x.address || '').trim().toLowerCase()).filter(Boolean))].sort();
}

function fallbackKey(row) {
  return `fallback:${normalizeSubject(row.subject)}|${participants(row).join(',')}`;
}

function buildGroups(rows) {
  const byMessageId = new Map();
  rows.forEach(r => { if (r.messageId) byMessageId.set(r.messageId, r); });

  const rootCache = new Map();
  function rootOf(row) {
    if (rootCache.has(row.emailId)) return rootCache.get(row.emailId);
    let cur = row;
    const seen = new Set();
    while (cur && cur.inReplyTo && byMessageId.has(cur.inReplyTo) && !seen.has(cur.emailId)) {
      seen.add(cur.emailId);
      cur = byMessageId.get(cur.inReplyTo);
    }
    const root = cur || row;
    const key = root.messageId ? `message:${root.messageId}` : fallbackKey(root);
    rootCache.set(row.emailId, key);
    return key;
  }

  const groups = new Map();
  rows.forEach(row => {
    let key = rootOf(row);
    // Old sent mail may have no Message-ID. Prefer the normalized subject+participants
    // key when the root itself has no stable Message-ID.
    if (key.startsWith('message:') && !row.messageId && !row.inReplyTo) {
      const fb = fallbackKey(row);
      const existing = [...groups.values()].find(g => g.fallback === fb);
      if (existing) key = existing.key;
    }
    if (!groups.has(key)) groups.set(key, { key, rows: [], fallback: fallbackKey(row) });
    groups.get(key).rows.push(row);
  });

  // Merge fallback groups with the same subject and participants. This handles
  // historical messages created before messageId was persisted.
  const merged = new Map();
  for (const group of groups.values()) {
    const mergeKey = group.fallback;
    if (mergeKey.startsWith('fallback:')) {
      const existing = merged.get(mergeKey);
      if (existing) existing.rows.push(...group.rows);
      else merged.set(mergeKey, group);
    } else {
      merged.set(group.key, group);
    }
  }

  return [...merged.values()].map(group => {
    group.rows.sort((a,b) => a.emailId - b.emailId);
    const latest = group.rows[group.rows.length - 1];
    const root = group.rows[0];
    return {
      threadId: String(root.emailId),
      subject: latest.subject || root.subject || '',
      count: group.rows.length,
      unreadCount: group.rows.filter(x => x.unread === 0 && x.type === emailConst.type.RECEIVE).length,
      latestTime: latest.createTime,
      latestSender: latest.name || latest.sendEmail,
      latestEmail: latest,
      messages: group.rows
    };
  }).sort((a,b) => b.latestEmail.emailId - a.latestEmail.emailId);
}

const conversationService = {
  async loadRows(c, userId, accountId) {
    const rows = await orm(c).select({ ...email }).from(email)
      .leftJoin(account, eq(account.accountId, email.accountId))
      .where(and(
        eq(email.userId, userId),
        eq(email.accountId, Number(accountId)),
        eq(email.isDel, isDel.NORMAL),
        ne(email.status, emailConst.status.SAVING),
        or(eq(email.type, emailConst.type.SEND), eq(email.type, emailConst.type.RECEIVE))
      ))
      .orderBy(desc(email.emailId))
      .limit(1500)
      .all();
    await attService.selectByEmailIds(c, rows.map(x => x.emailId));
    const attList = await attService.selectByEmailIds(c, rows.map(x => x.emailId));
    rows.forEach(row => row.attList = attList.filter(a => a.emailId === row.emailId));
    return rows;
  },

  async list(c, userId, accountId) {
    const rows = await this.loadRows(c, userId, accountId);
    const groups = buildGroups(rows);
    return { list: groups, total: groups.length };
  },

  async detail(c, userId, accountId, threadId) {
    const rows = await this.loadRows(c, userId, accountId);
    const group = buildGroups(rows).find(x => x.threadId === String(threadId));
    return group || null;
  }
};

export default conversationService;
''', encoding='utf-8')

