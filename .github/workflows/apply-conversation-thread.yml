.title { font-size:20px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.message-count { color:var(--secondary-text-color); font-size:13px; }
.scroll { flex:1; }
.messages { max-width:1100px; margin:0 auto; padding:14px 20px 40px; }
.message-card { border:1px solid var(--light-border-color); border-radius:8px; margin-bottom:12px; overflow:hidden; background:var(--el-bg-color); }
.message-head { display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; }
.avatar { flex:0 0 38px; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--el-color-primary-light-8); color:var(--el-color-primary); font-weight:700; }
.head-main { flex:1; min-width:0; }
.sender-line { display:flex; gap:6px; flex-wrap:wrap; }
.sender-line span,.recipient,.date { color:var(--secondary-text-color); font-size:13px; }
.recipient { margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.date { white-space:nowrap; }
.chevron { flex:0 0 auto; }
.message-body { padding:0 22px 18px 66px; }
.message-body :deep(.shadow-html) { width:100%; }
pre { font-family:inherit; white-space:pre-wrap; word-break:break-word; }
.attachments { margin-top:18px; border:1px solid var(--light-border-color); border-radius:6px; padding:10px; max-width:700px; }
.att-title { font-weight:700; margin-bottom:8px; }
.att-item { display:flex; gap:12px; align-items:center; padding:7px 8px; background:var(--light-ill); border-radius:4px; margin-top:6px; }
.att-item span:first-child { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.att-item span:nth-child(2) { color:var(--secondary-text-color); }
.att-item a { color:var(--secondary-text-color); display:flex; }
.message-actions { display:flex; gap:8px; margin-top:18px; }
@media(max-width:767px){ .messages{padding:10px}.message-body{padding:0 14px 16px}.date{font-size:11px}.title{font-size:17px} }
