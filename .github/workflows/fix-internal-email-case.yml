name: Fix internal email case matching

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/fix-internal-email-case.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("mail-worker/src/service/email-service.js")
          text = path.read_text()

          old_lookup = "\t\tlet accountList = await orm(c).select().from(account).where(inArray(account.email, receiveEmail)).all();"
          new_lookup = "\t\tconst normalizedReceiveEmail = receiveEmail.map(email => email.toLowerCase());\n\t\tlet accountList = await orm(c).select().from(account).where(\n\t\t\tinArray(sql`${account.email} COLLATE NOCASE`, normalizedReceiveEmail)\n\t\t).all();"

          old_find = "\t\t\tconst accountRow = accountList.find(accountRow => accountRow.email === email);"
          new_find = "\t\t\tconst accountRow = accountList.find(accountRow => accountRow.email.toLowerCase() === email.toLowerCase());"

          if old_lookup not in text:
              raise SystemExit("Target lookup code not found; aborting without changes.")
          if old_find not in text:
              raise SystemExit("Target account match code not found; aborting without changes.")

          text = text.replace(old_lookup, new_lookup, 1)
          text = text.replace(old_find, new_find, 1)
          path.write_text(text)
          PY

      - name: Commit targeted fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-internal-email-case.yml
          git add mail-worker/src/service/email-service.js
          git diff --cached --check
          git diff --cached -- mail-worker/src/service/email-service.js
          git commit -m "fix: make internal email recipient matching case-insensitive"
          git push
