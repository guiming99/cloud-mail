name: Apply custom mail features
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch source files
        run: |
          python3 <<'PY'
          from pathlib import Path
          def patch(path, pairs):
              p=Path(path); s=p.read_text(); changed=False
              for old,new in pairs:
                  n=s.count(old)
                  print(path, 'matches', n, old[:50].replace('\\n','\\n'))
                  if n:
                      s=s.replace(old,new,1); changed=True
              if changed: p.write_text(s)
          patch('mail-vue/src/layout/write/index.vue', [
              ('''        </el-input-tag>\n        <el-input v-model="form.subject"''', '''        </el-input-tag>\n        <div class="recipient-options">\n          <el-button link size="small" @click="showCc = !showCc">抄送</el-button>\n          <el-button link size="small" @click="showBcc = !showBcc">密送</el-button>\n        </div>\n        <el-input-tag v-if="showCc" v-model="form.cc" class="extra-recipient" placeholder="抄送邮箱，回车确认" />\n        <el-input-tag v-if="showBcc" v-model="form.bcc" class="extra-recipient" placeholder="密送邮箱，回车确认" />\n        <el-input v-model="form.subject"'''),
              ('const showContacts = ref(false)\n','const showContacts = ref(false)\nconst showCc = ref(false)\nconst showBcc = ref(false)\n'),
              ('  receiveEmail: [],\n','  receiveEmail: [],\n  cc: [],\n  bcc: [],\n'),
              ('const selectRecipientList = ref([])','''const selectRecipientList = ref([])\n\nfunction signatureKey(accountId) { return `cloudmail-signature-${accountId}` }\nfunction getSignature(accountId) { return localStorage.getItem(signatureKey(accountId)) || '' }\nfunction appendSignature(content, accountId) {\n  const signature = getSignature(accountId)\n  if (!signature || content.includes('data-cloudmail-signature="1"')) return content\n  return `${content || ''}<div data-cloudmail-signature="1"><br><br>${signature}</div>`\n}\nfunction setSignatureFromAccount() {\n  if (form.sendType === 'forward' || form.sendType === 'reply') return\n  const signature = getSignature(form.accountId)\n  if (signature) defValue.value = signature\n}'''),
              ('  if (!form.content) {\n    form.content = editor.value.getContent();\n  }\n\n  if (!form.content) {','  if (!form.content) {\n    form.content = editor.value.getContent();\n  }\n\n  form.content = appendSignature(form.content, form.accountId);\n\n  if (!form.content) {'),
              ('  form.receiveEmail = []\n  form.subject =','  form.receiveEmail = []\n  form.cc = []\n  form.bcc = []\n  showCc.value = false\n  showBcc.value = false\n  form.subject ='),
              ('import {toOssDomain} from "@/utils/convert.js";','import {toOssDomain, cvtR2Url} from "@/utils/convert.js";'),
              ('  show.value = true;\n  editor.value.focus()','  show.value = true;\n  setSignatureFromAccount();\n  editor.value.focus()'),
              ('''  setTimeout(() => {\n    defValue.value = `\n      ${formatImage(email.content) || `<pre style="font-family: inherit;word-break: break-word;white-space: pre-wrap;margin: 0">${email.text}</pre>`}\n    `\n    open()''','''  setTimeout(async () => {\n    defValue.value = `\n      ${formatImage(email.content) || `<pre style="font-family: inherit;word-break: break-word;white-space: pre-wrap;margin: 0">${email.text}</pre>`}\n    `\n    if (email.attList?.length) {\n      for (const att of email.attList) {\n        try {\n          const response = await fetch(cvtR2Url(att.key))\n          const blob = await response.blob()\n          const reader = new FileReader()\n          const content = await new Promise(resolve => {\n            reader.onload = () => resolve(String(reader.result).split(',')[1] || '')\n            reader.readAsDataURL(blob)\n          })\n          form.attachments.push({content, filename: att.filename, size: att.size, contentType: att.contentType || blob.type})\n        } catch (e) { console.error('转发附件读取失败:', att.filename, e) }\n      }\n    }\n    open()'''),
              ('''    .button-item {\n        display: grid;''','''    .recipient-options { display: flex; gap: 2px; margin-top: -10px; }\n    .extra-recipient { width: 100%; }\n    .button-item {\n        display: grid;''')
          ])
          patch('mail-worker/src/service/email-service.js', [
              ('\t\t\treceiveEmail, //收件人邮箱\n\t\t\ttext, //邮件纯文本','\t\t\treceiveEmail, //收件人邮箱\n\t\t\tcc = [], //抄送\n\t\t\tbcc = [], //密送\n\t\t\ttext, //邮件纯文本'),
              ('\t\t\t\t\tto: [...params.receiveEmail],\n\t\t\t\t\tsubject: params.subject','\t\t\t\t\tto: [...params.receiveEmail],\n\t\t\t\t\tcc: [...(params.cc || [])],\n\t\t\t\t\tbcc: [...(params.bcc || [])],\n\t\t\t\t\tsubject: params.subject'),
              ('\t\t\t\t\tattachments: [...imageDataList, ...attachments],\n\t\t\t\t\tsendType,','\t\t\t\t\tattachments: [...imageDataList, ...attachments],\n\t\t\t\t\tcc,\n\t\t\t\t\tbcc,\n\t\t\t\t\tsendType,'),
              ('\t\temailData.text = text;\n\t\t\temailData.accountId = accountId;','\t\temailData.text = text;\n\t\temailData.cc = JSON.stringify(cc || []);\n\t\temailData.bcc = JSON.stringify(bcc || []);\n\t\temailData.accountId = accountId;'),
              ('\t\t\tto: [...params.receiveEmail],\n\t\t\tsubject: params.subject,','\t\t\tto: [...params.receiveEmail],\n\t\t\tcc: [...(params.cc || [])],\n\t\t\tbcc: [...(params.bcc || [])],\n\t\t\tsubject: params.subject,')
          ])
          Path('.github/workflows/apply-custom-mail-features.yml').unlink()
          Path('.patch-trigger').unlink(missing_ok=True)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add CC BCC signature and forward attachments' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
