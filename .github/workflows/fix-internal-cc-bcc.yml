name: Fix internal CC BCC delivery
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch internal recipients
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('mail-worker/src/service/email-service.js')
          s=p.read_text()
          old='await this.HandleOnSiteEmail(c, receiveEmail, emailResult, attList);'
          new='await this.HandleOnSiteEmail(c, [...new Set([...(receiveEmail || []), ...(cc || []), ...(bcc || [])])], emailResult, attList);'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          Path('.github/workflows/fix-internal-cc-bcc.yml').unlink()
          Path('.internal-trigger').unlink(missing_ok=True)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: deliver internal CC and BCC recipients' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
