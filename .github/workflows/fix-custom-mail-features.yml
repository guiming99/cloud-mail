name: Finish custom mail features
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Finish patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def patch(path, pairs):
              p=Path(path); s=p.read_text(); changed=False
              for old,new in pairs:
                  if old in s:
                      s=s.replace(old,new,1); changed=True
              if changed: p.write_text(s)

          patch('mail-vue/src/layout/write/index.vue', [
              ('  receiveEmail: [],\n  accountId: -1,','  receiveEmail: [],\n  cc: [],\n  bcc: [],\n  accountId: -1,'),
              ('<el-button link size="small" @click="showBcc = !showBcc">密送</el-button>','<el-button link size="small" @click="showBcc = !showBcc">密送</el-button>\n          <el-button link size="small" @click="editSignature">签名</el-button>'),
              ('''function setSignatureFromAccount() {\n  if (form.sendType === 'forward' || form.sendType === 'reply') return\n  const signature = getSignature(form.accountId)\n  if (signature) defValue.value = signature\n}''','''function setSignatureFromAccount() {\n  if (form.sendType === 'forward' || form.sendType === 'reply') return\n  const signature = getSignature(form.accountId)\n  if (signature) defValue.value = signature\n}\n\nfunction editSignature() {\n  const current = getSignature(form.accountId)\n  const value = window.prompt('请输入签名（换行会自动保留）：', current.replace(/<br\\s*\\/?>(<br\\s*\\/?>)?/gi, '\\n'))\n  if (value === null) return\n  const html = value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\\r?\\n/g, '<br>')\n  localStorage.setItem(signatureKey(form.accountId), html)\n  ElMessage({message: value ? '签名已保存' : '签名已清除', type: 'success', plain: true})\n}'''),
              ('''    defValue.value = `\n      ${formatImage(email.content) || `<pre style="font-family: inherit;word-break: break-word;white-space: pre-wrap;margin: 0">${email.text}</pre>`}\n    `\n    if (email.attList?.length) {\n      for (const att of email.attList) {\n        try {\n          const response = await fetch(cvtR2Url(att.key))\n          const blob = await response.blob()\n          const reader = new FileReader()\n          const content = await new Promise(resolve => {\n            reader.onload = () => resolve(String(reader.result).split(',')[1] || '')\n            reader.readAsDataURL(blob)\n          })\n          form.attachments.push({content, filename: att.filename, size: att.size, contentType: att.contentType || blob.type})\n        } catch (e) { console.error('转发附件读取失败:', att.filename, e) }\n      }\n    }\n    open()''','''    defValue.value = `\n      ${formatImage(email.content) || `<pre style="font-family: inherit;word-break: break-word;white-space: pre-wrap;margin: 0">${email.text}</pre>`}\n    `\n    form.emailId = email.emailId\n    open()'''),
          ])

          patch('mail-worker/src/service/email-service.js', [
              ('\t\t\t\t\tattachments: [...imageDataList, ...attachments],\n\t\t\t\t\tsendType,','\t\t\t\t\tattachments: [...imageDataList, ...attachments],\n\t\t\t\t\tcc,\n\t\t\t\t\tbcc,\n\t\t\t\t\tsendType,'),
              ('\t\t\tto: [...params.receiveEmail],\n\t\t\tsubject: params.subject','\t\t\tto: [...params.receiveEmail],\n\t\t\tcc: [...(params.cc || [])],\n\t\t\tbcc: [...(params.bcc || [])],\n\t\t\tsubject: params.subject'),
              ('\t\temailData.text = text;\n\t\temailData.accountId = accountId;','\t\temailData.text = text;\n\t\temailData.cc = JSON.stringify(cc || []);\n\t\temailData.bcc = JSON.stringify(bcc || []);\n\t\temailData.accountId = accountId;')
          ])

          p=Path('.github/workflows/fix-custom-mail-features.yml'); p.unlink()
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete CC BCC signature and forwarding' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
