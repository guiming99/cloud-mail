name: Recipient To CC patch

on:
  push:
    branches:
      - fix/recipient-to-cc

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/recipient-to-cc

      - name: Patch recipient To and CC interactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('mail-vue/src/layout/write/index.vue')
          s = p.read_text()

          if 'recipient-drop-zone' in s:
              raise SystemExit('patch already present')

          old_to = '''        <el-input-tag @add-tag="addTagChange" tag-type="primary" @input="inputChange" size="default" v-model="form.receiveEmail">
          <template #prefix>'''
          new_to = '''        <div class="recipient-drop-zone" @dragover.prevent @drop="dropRecipient('receiveEmail')">
          <el-input-tag @add-tag="addTagChange" tag-type="primary" @input="inputChange" size="default" v-model="form.receiveEmail">
            <template #tag="{ value }">
              <div class="recipient-tag-content" draggable="true" @dragstart="startRecipientDrag($event, 'receiveEmail', value)" @dragend="endRecipientDrag">
                <span class="recipient-tag-text">{{ value }}</span>
                <Icon class="recipient-mobile-move" icon="material-symbols:drive-file-move-outline" width="15" height="15" @click.stop="moveRecipient('receiveEmail', 'cc', value)" />
              </div>
            </template>
          <template #prefix>'''
          if old_to not in s:
              raise SystemExit('To anchor not found')
          s = s.replace(old_to, new_to, 1)

          old_to_close = '''        </el-input-tag>

        <div class="recipient-options">'''
          new_to_close = '''          </el-input-tag>
        </div>

        <div class="recipient-options">'''
          if old_to_close not in s:
              raise SystemExit('To close anchor not found')
          s = s.replace(old_to_close, new_to_close, 1)

          old_cc = '''        <el-input-tag v-if="showCc" v-model="form.cc" class="extra-recipient" placeholder="抄送邮箱，回车确认">
          <template #suffix>'''
          new_cc = '''        <div v-if="showCc" class="recipient-drop-zone" @dragover.prevent @drop="dropRecipient('cc')">
          <el-input-tag v-model="form.cc" class="extra-recipient" placeholder="抄送邮箱，回车确认">
            <template #tag="{ value }">
              <div class="recipient-tag-content" draggable="true" @dragstart="startRecipientDrag($event, 'cc', value)" @dragend="endRecipientDrag">
                <span class="recipient-tag-text">{{ value }}</span>
                <Icon class="recipient-mobile-move" icon="material-symbols:drive-file-move-outline" width="15" height="15" @click.stop="moveRecipient('cc', 'receiveEmail', value)" />
              </div>
            </template>
          <template #suffix>'''
          if old_cc not in s:
              raise SystemExit('CC anchor not found')
          s = s.replace(old_cc, new_cc, 1)

          old_cc_close = '''        </el-input-tag>
        <el-input-tag v-if="showBcc"'''
          new_cc_close = '''          </el-input-tag>
        </div>
        <el-input-tag v-if="showBcc"'''
          if old_cc_close not in s:
              raise SystemExit('CC close anchor not found')
          s = s.replace(old_cc_close, new_cc_close, 1)

          script_anchor = 'const selectRecipientList = ref([])\n'
          script_insert = '''const selectRecipientList = ref([])
const draggingRecipient = ref(null)

function startRecipientDrag(event, source, value) {
  draggingRecipient.value = {source, value}
  if (event.dataTransfer) {
    event.dataTransfer.effectAllowed = 'move'
    event.dataTransfer.setData('text/plain', value)
  }
}

function endRecipientDrag() {
  draggingRecipient.value = null
}

function moveRecipient(source, target, value) {
  if (source === target) return
  const sourceList = form[source] || []
  const targetList = form[target] || []
  if (!sourceList.includes(value)) return

  form[source] = sourceList.filter(item => item !== value)
  if (!targetList.includes(value)) {
    targetList.push(value)
  }
  form[target] = targetList

  if (target === 'cc') {
    showCc.value = true
  }
}

function dropRecipient(target) {
  const drag = draggingRecipient.value
  if (!drag) return
  moveRecipient(drag.source, target, drag.value)
  draggingRecipient.value = null
}
'''
          if script_anchor not in s:
              raise SystemExit('script anchor not found')
          s = s.replace(script_anchor, script_insert, 1)

          style_anchor = '</style>'
          style_insert = '''
.recipient-drop-zone {
  width: 100%;
}

.recipient-tag-content {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  max-width: 100%;
  cursor: grab;
}

.recipient-tag-content:active {
  cursor: grabbing;
}

.recipient-tag-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.recipient-mobile-move {
  display: none;
  flex: 0 0 auto;
  cursor: pointer;
}

@media (max-width: 767px) {
  .recipient-mobile-move {
    display: inline-flex;
  }

  .recipient-tag-content {
    max-width: calc(100vw - 130px);
  }
}
'''
          if style_anchor not in s:
              raise SystemExit('style anchor not found')
          s = s.replace(style_anchor, style_insert + '\n' + style_anchor, 1)

          p.write_text(s)
          PY

      - name: Verify build and diff
        run: |
          cd mail-vue
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec vite build --mode release
          cd ..
          git diff --check

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mail-vue/src/layout/write/index.vue
          git commit -m 'feat: move recipients between to and cc'
          git push origin fix/recipient-to-cc

      - name: Remove temporary workflow from branch
        if: success()
        run: |
          git rm .github/workflows/recipient-to-cc.yml
          git commit -m 'chore: remove recipient patch workflow'
          git push origin fix/recipient-to-cc
