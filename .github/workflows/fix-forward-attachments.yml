name: Finish forward attachments
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch forward attachments
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('mail-worker/src/service/email-service.js')
          s=p.read_text()
          s=s.replace("import telegramService from './telegram-service';", "import telegramService from './telegram-service';\nimport r2Service from './r2-service';", 1)
          marker='''\t\tif (sendType === 'reply') {\n\n\t\t\temailRow = await this.selectById(c, emailId);\n\n\t\t\tif (!emailRow) {\n\t\t\t\tthrow new BizError(t('notExistEmailReply'));\n\t\t\t}\n\n\t\t}'''
          block=marker+'''\n\n\t\t//转发邮件时，从当前账号自己的附件记录中读取原附件并重新发送\n\t\tif (sendType === 'forward' && emailId) {\n\t\t\tconst sourceEmail = await orm(c).select({ emailId: email.emailId }).from(email).where(\n\t\t\t\tand(eq(email.emailId, Number(emailId)), eq(email.userId, userId))\n\t\t\t).get();\n\n\t\t\tif (!sourceEmail) {\n\t\t\t\tthrow new BizError('转发邮件不存在或无权限');\n\t\t\t}\n\n\t\t\tconst sourceAttList = await attService.selectByEmailIds(c, [Number(emailId)]);\n\t\t\tif (sourceAttList.length > 10) {\n\t\t\t\tthrow new BizError(t('attLimit'));\n\t\t\t}\n\n\t\t\tfor (const sourceAtt of sourceAttList) {\n\t\t\t\tconst obj = await r2Service.getObj(c, sourceAtt.key);\n\t\t\t\tif (!obj) continue;\n\t\t\t\tattachments.push({\n\t\t\t\t\tcontent: await obj.arrayBuffer(),\n\t\t\t\t\tfilename: sourceAtt.filename,\n\t\t\t\t\tsize: sourceAtt.size,\n\t\t\t\t\tcontentType: sourceAtt.mimeType,\n\t\t\t\t\ttype: sourceAtt.mimeType\n\t\t\t\t});\n\t\t\t}\n\t\t}'''
          if marker in s and "sendType === 'forward' && emailId" not in s:
              s=s.replace(marker, block, 1)
          s=s.replace("import {toOssDomain, cvtR2Url} from \"@/utils/convert.js\";", "import {toOssDomain} from \"@/utils/convert.js\";") if False else s
          p.write_text(s)

          p=Path('mail-vue/src/layout/write/index.vue')
          s=p.read_text().replace('import {toOssDomain, cvtR2Url} from "@/utils/convert.js";', 'import {toOssDomain} from "@/utils/convert.js";')
          p.write_text(s)
          Path('.github/workflows/fix-forward-attachments.yml').unlink()
          Path('.finish-trigger').unlink(missing_ok=True)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: forward original attachments from storage' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
