name: Patch mail composer

on:
  push:
    branches:
      - fix-signature-forward-divider

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply mail composer fixes') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch composer
        shell: python
        run: |
          from pathlib import Path

          path = Path('mail-vue/src/layout/write/index.vue')
          text = path.read_text(encoding='utf-8')

          old = '''function applySignature(content, accountId) {
  const signatureBlock = signatureHtml(accountId)
  if (!signatureBlock) return content || ''
  const marker = /<div data-cloudmail-signature=\"1\">[\\s\\S]*?<\\/div>/i
  if (marker.test(content || '')) {
    return (content || '').replace(marker, signatureBlock)
  }
  return `${content || ''}${signatureBlock}`
}'''
          new = '''function applySignature(content, accountId) {
  const signatureBlock = signatureHtml(accountId)
  if (!signatureBlock) return content || ''
  const marker = /<div data-cloudmail-signature=\"1\">[\\s\\S]*?<\\/div>/i
  if (marker.test(content || '')) {
    return (content || '').replace(marker, signatureBlock)
  }

  // For replies/forwards, keep the user's signature above the quoted
  // original message instead of appending it after the quoted content.
  if (form.sendType === 'reply' || form.sendType === 'forward') {
    const current = content || ''
    const quoteIndex = current.search(/<blockquote\\b/i)
    if (quoteIndex >= 0) {
      return current.slice(0, quoteIndex) + signatureBlock + current.slice(quoteIndex)
    }
  }

  return `${content || ''}${signatureBlock}`
}'''
          if old not in text:
              raise SystemExit('applySignature block not found')
          text = text.replace(old, new, 1)

          old = '''  form.content = applySignature(form.content, form.accountId);

  if (!form.content) {'''
          new = '''  // New messages get the signature at send time. Replies and forwards
  // already contain one signature in the composer, above the quoted message.
  if (form.sendType !== 'reply' && form.sendType !== 'forward') {
    form.content = applySignature(form.content, form.accountId);
  }

  if (!form.content) {'''
          if old not in text:
              raise SystemExit('sendEmail signature block not found')
          text = text.replace(old, new, 1)

          old = '''function openForward(email) {
  resetForm();
  email.subject = email.subject || ''
  form.subject = email.subject
  form.sendType = 'forward'
  defValue.value = ''

  setTimeout(async () => {
    defValue.value = `
      ${formatImage(email.content) || `<pre style=\"font-family: inherit;word-break: break-word;white-space: pre-wrap;margin: 0\">${email.text}</pre>`}
    `
    form.emailId = email.emailId
    open()

    nextTick(() => {
      backReply.content = editor.value.getContent()
      backReply.subject = form.subject
      backReply.receiveEmail = form.receiveEmail
      backReply.sendType = form.sendType
    })
  });
}'''
          new = '''function openForward(email) {
  resetForm();
  email.subject = email.subject || ''
  form.subject = email.subject
  form.sendType = 'forward'
  defValue.value = ''

  setTimeout(async () => {
    const originalContent = formatImage(email.content) || `<pre style=\"font-family: inherit;word-break: break-word;white-space: pre-wrap;margin: 0\">${email.text}</pre>`
    const signatureBlock = signatureHtml(accountStore.currentAccount.accountId || userStore.user.account.accountId)

    // Use the same visual separation style as Reply: the forwarded message
    // is clearly separated and quoted, while the user's signature stays above it.
    defValue.value = `
      ${signatureBlock}
      <div style=\"margin-top: 12px;\">---------- Forwarded message ---------</div>
      <div>${formatDetailDate(email.createTime)} ${email.name} &lt;${email.sendEmail}&gt;</div>
      <div>To: ${formateForwardRecipients(email.recipient)}</div>
      <div>Subject: ${email.subject}</div>
      <blockquote class=\"mceNonEditable\" style=\"margin: 8px 0 0 0.8ex;border-left: 1px solid rgb(204,204,204);padding-left: 1ex;\">
        <article>${originalContent}</article>
      </blockquote>`
    form.emailId = email.emailId
    open()

    nextTick(() => {
      backReply.content = editor.value.getContent()
      backReply.subject = form.subject
      backReply.receiveEmail = form.receiveEmail
      backReply.sendType = form.sendType
    })
  });
}'''
          if old not in text:
              raise SystemExit('openForward block not found')
          text = text.replace(old, new, 1)

          old = '''function openReply(email) {
  resetForm();
  email.subject = email.subject || ''
  form.receiveEmail.push(email.sendEmail)
  form.subject = (
      email.subject.startsWith('Re:') ||
      email.subject.startsWith('Re：') ||
      email.subject.startsWith('回复：') ||
      email.subject.startsWith('回复:')) ? email.subject : 'Re: ' + email.subject
  form.sendType = 'reply'
  form.emailId = email.emailId
  defValue.value = ''

  setTimeout(() => {
    defValue.value = `
    <div></div>
    <div>
    <br>
        ${formatDetailDate(email.createTime)} ${email.name} &lt${email.sendEmail}&gt ${t('wrote')}:
    </div>
    <blockquote class=\"mceNonEditable\" style=\"margin: 0 0 0 0.8ex;border-left: 1px solid rgb(204,204,204);padding-left: 1ex;\">
      <articl>
          ${formatImage(email.content) || `<pre style=\"font-family: inherit;word-break: break-word;white-space: pre-wrap;margin: 0\">${email.text}</pre>`}
      </article>
    </blockquote>`
    open()
'''
          new = '''function openReply(email) {
  resetForm();
  email.subject = email.subject || ''
  form.receiveEmail.push(email.sendEmail)
  form.subject = (
      email.subject.startsWith('Re:') ||
      email.subject.startsWith('Re：') ||
      email.subject.startsWith('回复：') ||
      email.subject.startsWith('回复:')) ? email.subject : 'Re: ' + email.subject
  form.sendType = 'reply'
  form.emailId = email.emailId
  defValue.value = ''

  setTimeout(() => {
    const originalContent = formatImage(email.content) || `<pre style=\"font-family: inherit;word-break: break-word;white-space: pre-wrap;margin: 0\">${email.text}</pre>`
    const signatureBlock = signatureHtml(accountStore.currentAccount.accountId || userStore.user.account.accountId)
    defValue.value = `
    ${signatureBlock}
    <div>
    <br>
        ${formatDetailDate(email.createTime)} ${email.name} &lt;${email.sendEmail}&gt; ${t('wrote')}:
    </div>
    <blockquote class=\"mceNonEditable\" style=\"margin: 0 0 0 0.8ex;border-left: 1px solid rgb(204,204,204);padding-left: 1ex;\">
      <article>${originalContent}</article>
    </blockquote>`
    open()
'''
          if old not in text:
              raise SystemExit('openReply block not found')
          text = text.replace(old, new, 1)

          old = '''function formatImage(content) {
  content = content || '';
  const domain = settingStore.settings.r2Domain;
  return content.replace(/{{domain}}/g, toOssDomain(domain) + '/');
}'''
          new = '''function formateForwardRecipients(recipient) {
  try {
    const list = JSON.parse(recipient || '[]')
    return list.map(item => item.address || item.name || '').filter(Boolean).join(', ')
  } catch (e) {
    return recipient || ''
  }
}

function formatImage(content) {
  content = content || '';
  const domain = settingStore.settings.r2Domain;
  return content.replace(/{{domain}}/g, toOssDomain(domain) + '/');
}'''
          if old not in text:
              raise SystemExit('formatImage block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mail-vue/src/layout/write/index.vue
          git commit -m "Apply mail composer fixes"
          git push
